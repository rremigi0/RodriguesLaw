<div class="dynamic-content">
    <form action="/addPrazos" method="POST">
        <div class="form-group">
          <label for="processo">Processo</label>
          <input type="text" class="form-control" id="processo" aria-describedby="emailHelp" name="processo">
        </div>
        <div class="form-group">
          <label for="autor">Autor</label>
          <input type="text" class="form-control" id="autor" name="autor">
        </div>
        <div class="form-group">
          <label for="reu">Réu</label>
          <input type="text" class="form-control" id="reu" name="reu">
        </div>
        <div class="form-group">
          <label for="procedimento">Procedimento</label>
          <input type="text" class="form-control" id="procedimento" name="procedimento">
        </div>
        <div class="form-group">
          <label for="peticao">Petição Processual</label>
          <input type="text" class="form-control" id="peticao" name="peticao">
        </div>
        <div class="form-group">
          <label for="publicacao">Publicação</label>
          <input type="date" class="form-control" id="publicacao" name="publicacao">
        </div>
        <div class="form-group">
          <label for="prazo">Prazo</label>
          <input type="date" class="form-control" id="prazo" name="prazo">
        </div>
        <a href="/cad"><button type="submit" class="btn">Cadastrar</button></a>
    </form>
</div>
